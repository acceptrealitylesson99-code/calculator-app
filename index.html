<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" integrity="sha512-Vd1m+0s0F3chstOpaPzN9KxK2wDQScuvU9aY21GOC4QczW5ghGTw52z7rKz1rrMfFsBbyS3pHfRXvY1/hS2McA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</head>
<style>
    .container{
        background: #020617;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        height: 80vh ;
          
  border-radius: 20px;
    width: 80vw; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    body{
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a192f;
    }
    .output{
font-size: 50px;
   text-shadow: 0 0 10px rgba(0, 198, 255, 0.7);
 color: #00E5FF;


    }
    h1 , h2{
        color: #00E5FF;
    }
    input{
        background: #0f172a;
  color: #00E5FF;
  border: 1px solid #00B4D8;
  border-radius: 5px;
    }
    #addBtn{
        background: #00E5FF; 
        color: black;
        border: none;
    }
    #subtractBtn{
        background: #00B4D8;
         color: white;
        border: none;
    }
    #multiplyBtn{
        background: #0096C7;
         color: white;
        border: none;
    }
    #divideBtn{
        background: #00f5d454;
         color: black;
        border: none;
    }
        #clearBtn{
            background: #ff6b6b;
            color: white;
            border: none;
        }
        .btn:hover {
  transform: scale(1.07);
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
}
    
</style>
<body>
   
   <div class="container d-flex flex-column align-items-center justify-content-center gap-4" data-aos="flip-left" data-aos-duration="3000" data-aos-delay="1000">
            
   <h1 data-aos="zoom-in" data-aos-delay="2000" data-aos-duration="1500">Simple Calculator</h1>
    <div class="row g-3">
        <input type="number" id="num1" placeholder="Enter first number" data-aos="fade-down" data-aos-delay="1500" data-aos-duration="2000">
        <input type="number" id="num2" placeholder="Enter second number" data-aos="fade-down" data-aos-delay="2000" data-aos-duration="2000">

    </div>
    <div class="buttons gap-2 d-flex flex-wrap justify-content-center">
        <button class="btn" id="addBtn" onclick="add()" data-aos="zoom-in" data-aos-delay="2200" data-aos-duration="2500">ADD</button>
        <button class="btn " id="subtractBtn" onclick="sub()" data-aos="zoom-in" data-aos-delay="2400" data-aos-duration="2500">SUBTRACT</button>
        <button class="btn" id="multiplyBtn" onclick="multi()" data-aos="zoom-in" data-aos-delay="2600" data-aos-duration="2500">MULTIPLY</button>
        <button class="btn btn-danger" id="divideBtn" onclick="divide()" data-aos="zoom-in" data-aos-delay="2800" data-aos-duration="2500">DIVIDE</button>
<button class="btn btn-warning" id="clearBtn" onclick="clearAll()" data-aos="zoom-in" data-aos-delay="3000" data-aos-duration="2500">CLEAR</button>        
    </div>
        <div class="" data-aos="fade-up" data-aos-delay="3000" data-aos-duration="2000">
            <h2 id="res">Result: </h2><div id="result"  ></div>
   </div>
   </div>

    <script src="./app.js"></script>
 <script>
  AOS.init();
</script>
</body>
</html>
